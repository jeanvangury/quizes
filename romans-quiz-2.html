<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Romans Quiz II</title>

<style>
body { font-family: Arial; padding:20px; max-width:800px; margin:auto; }

.question { margin-bottom:20px; padding:10px; border-radius:8px; }

.question p {
  font-weight: bold;
  font-size: 16px;
}

.correct { background:#d4edda; }
.incorrect { background:#f8d7da; }

.correct-answer { font-size:14px; margin-top:8px; }

.verse {
  font-size:13px;
  margin-top:5px;
  font-style:italic;
  color:#333;
}

.center { text-align:center; margin-top:20px; }

button { padding:10px 15px; font-size:16px; }

#result {
  font-size:20px;
  font-weight:bold;
  margin-top:20px;
  white-space:pre-line;
}

input[type="text"] {
  padding:10px 12px;
  font-size:16px;
  width: 260px;
  max-width: 100%;
  box-sizing:border-box;
}

#certificateContainer { display:none; margin-top: 24px; }
.certificate {
  width: 760px;
  max-width: 100%;
  position: relative;
  padding: 36px 28px 92px;
  background: #f7f7f7;
  border: 10px solid #7a2e2e;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}
.certificate::after {
  content: "";
  position: absolute;
  inset: 18px;
  border: 1px solid rgba(122,46,46,0.35);
  pointer-events: none;
}

.cert-corner {
  position: absolute;
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, #8b3a3a, #6a2323);
  opacity: 0.95;
}
.cert-corner.tl { top: -16px; left: -16px; clip-path: polygon(0 0, 100% 0, 0 100%); }
.cert-corner.tr { top: -16px; right: -16px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.cert-corner.bl { bottom: -16px; left: -16px; clip-path: polygon(0 0, 0 100%, 100% 100%); }
.cert-corner.br { bottom: -16px; right: -16px; clip-path: polygon(100% 0, 0 100%, 100% 100%); }

.certificate h2 {
  margin: 0;
  font-family: "Times New Roman", Times, serif;
  font-size: 36px;
  letter-spacing: 4px;
  font-weight: 700;
}
.certificate .small {
  margin-top: 16px;
  font-size: 14px;
  color: #333;
}
.certificate #certName {
  font-family: "Brush Script MT", "Lucida Handwriting", "Segoe Script", cursive;
  font-size: 46px;
  margin-top: 10px;
}
.certificate .meta {
  margin-top: 10px;
  font-size: 18px;
  font-weight: 700;
  color: #333;
}
.certificate .awardBy {
  margin-top: 16px;
  font-size: 14px;
  color: #333;
  font-weight: 700;
}

.cert-emblem {
  display: flex;
  justify-content: center;
  margin: 16px 0 8px;
}
.cert-emblem svg {
  width: 92px;
  height: 92px;
}

.cert-footer {
  position: absolute;
  left: 28px;
  right: 28px;
  bottom: 26px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
}
</style>
</head>

<body>

<h1>📖 Romans Quiz II</h1>
<p><em>Two questions per chapter (Romans 1–12); three questions per chapter (Romans 13–16). Scripture quotations follow the NIV.</em></p>

<div class="center">
  <label for="nameInput" style="display:block; font-size:16px; margin-bottom:8px; font-weight:700;">Your Name</label>
  <input id="nameInput" type="text" placeholder="Enter your name" autocomplete="name" />
</div>

<form id="quizForm"></form>

<div class="center">
<button onclick="submitQuiz()">Submit</button>
</div>

<div id="result"></div>
<div class="center" id="retakeContainer"></div>

<div id="certificateContainer" class="center">
  <div class="certificate">
    <span class="cert-corner tl" aria-hidden="true"></span>
    <span class="cert-corner tr" aria-hidden="true"></span>
    <span class="cert-corner bl" aria-hidden="true"></span>
    <span class="cert-corner br" aria-hidden="true"></span>

    <h2>CERTIFICATE<br>OF ACHIEVEMENT</h2>
    <div class="small">This certificate awarded to:</div>
    <div id="certName"></div>

    <div class="cert-emblem" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 90 C47 78 45 61 50 44 C43 46 36 53 33 62 C29 75 35 92 48 102"
              stroke="#d9b45b" stroke-width="5" stroke-linecap="round"/>
        <path d="M60 90 C73 78 75 61 70 44 C77 46 84 53 87 62 C91 75 85 92 72 102"
              stroke="#d9b45b" stroke-width="5" stroke-linecap="round"/>
        <path d="M43 36 C40 29 41 22 45 18 C50 13 57 15 60 22 C63 15 70 13 75 18 C79 22 80 29 77 36"
              stroke="#d9b45b" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="meta">Percentage: <span id="certPercent"></span></div>
    <div class="awardBy">Awarded by Friday Bible Study</div>

  </div>
</div>

<script>

const questions = [
{q:"The wrath of God is being revealed from heaven against what?",options:["Unbelief only","All godlessness and wickedness","Only idolaters","Only hypocrites"],answer:1,ref:"Romans 1:18",verse:"The wrath of God is being revealed from heaven against all the godlessness and wickedness of people."},
{q:"People exchanged the glory of the immortal God for what?",options:["Wealth","Images made to look like mortal humans","The law","Earthly kings"],answer:1,ref:"Romans 1:23",verse:"They exchanged the glory of the immortal God for images made to look like a mortal human being and birds and animals and reptiles."},
{q:"Because of your stubbornness and unrepentant heart, what are you storing up for yourself?",options:["Blessings","Honor","Wrath for the day of wrath","Knowledge"],answer:2,ref:"Romans 2:5",verse:"Because of your stubbornness and your unrepentant heart, you are storing up wrath against yourself for the day of God’s wrath."},
{q:"Circumcision has value if you do what?",options:["Observe the law","Are born Jewish","Are baptized","Fast regularly"],answer:0,ref:"Romans 2:25",verse:"Circumcision has value if you observe the law."},
{q:"All have sinned and fall short of what?",options:["The law","The glory of God","Heaven","Good works"],answer:1,ref:"Romans 3:23",verse:"For all have sinned and fall short of the glory of God."},
{q:"God presented Christ as a sacrifice of atonement, through faith in his blood. How did God do this?",options:["By ignoring sin","By his grace","By human merit","By the law"],answer:1,ref:"Romans 3:25",verse:"God presented Christ as a sacrifice of atonement, through faith in his blood. He did this to demonstrate his righteousness, because in his forbearance he had left the sins committed beforehand unpunished."},
{q:"David speaks of the blessedness of the one whom God credits righteousness apart from what?",options:["Faith","Works","Circumcision","Repentance"],answer:1,ref:"Romans 4:6-8",verse:"David says the same thing when he speaks of the blessedness of the one to whom God credits righteousness apart from works."},
{q:"Against all hope, Abraham in hope believed and so became the father of many nations, as it had been said to him, “So shall your” what “be”?",options:["Descendants","Works","Blessings","Years"],answer:0,ref:"Romans 4:18",verse:"Against all hope, Abraham in hope believed and so became the father of many nations, just as it had been said to him, “So shall your offspring be.”"},
{q:"Since we have been justified through faith, we have what with God through our Lord Jesus Christ?",options:["Wealth","Peace","The law","Immunity from trials"],answer:1,ref:"Romans 5:1",verse:"Since we have been justified through faith, we have peace with God through our Lord Jesus Christ."},
{q:"While we were still sinners, how did God demonstrate his love for us?",options:["By giving the law","By Christ dying for us","By sending angels","By destroying evil"],answer:1,ref:"Romans 5:8",verse:"God demonstrates his own love for us in this: While we were still sinners, Christ died for us."},
{q:"We were buried with him through baptism into death in order that we might live a new life in likeness to what?",options:["Adam’s fall","Christ’s resurrection","The law’s demands","Israel’s exodus"],answer:1,ref:"Romans 6:4",verse:"We were therefore buried with him through baptism into death in order that, just as Christ was raised from the dead through the glory of the Father, we too may live a new life."},
{q:"When you offer yourselves to someone as obedient slaves, you are slaves of the one you obey—whether you are slaves to sin leading to death, or to obedience leading to what?",options:["Wealth","Righteousness","Freedom from God","Earthly honor"],answer:1,ref:"Romans 6:16",verse:"Don’t you know that when you offer yourselves to someone as obedient slaves, you are slaves of the one you obey—whether you are slaves to sin, which leads to death, or to obedience, which leads to righteousness?"},
{q:"By dying to what once bound us, we have been released from the law so that we serve in the new way of the Spirit, and not in what?",options:["Faith","The old way of the written code","Prayer","Hope"],answer:1,ref:"Romans 7:6",verse:"But now, by dying to what once bound us, we have been released from the law so that we serve in the new way of the Spirit, and not in the old way of the written code."},
{q:"We know that the law is spiritual; but I am unspiritual, sold as a slave to what?",options:["The Romans","Sin","The temple","Tradition"],answer:1,ref:"Romans 7:14",verse:"We know that the law is spiritual; but I am unspiritual, sold as a slave to sin."},
{q:"Now if we are children, then we are heirs—heirs of God and co-heirs with Christ, if indeed we share in his sufferings in order that we may also share in what?",options:["His glory","His wealth","His anger","His law"],answer:0,ref:"Romans 8:17",verse:"Now if we are children, then we are heirs—heirs of God and co-heirs with Christ, if indeed we share in his sufferings in order that we may also share in his glory."},
{q:"He who did not spare his own Son, but gave him up for us all—how will he not also, along with him, graciously give us what?",options:["The law","All things","Earthly riches","Fame"],answer:1,ref:"Romans 8:32",verse:"He who did not spare his own Son, but gave him up for us all—how will he not also, along with him, graciously give us all things?"},
{q:"What shall we say, then? Gentiles, who did not pursue righteousness, have obtained it, a righteousness that is by what?",options:["Works","Faith","The law","Circumcision"],answer:1,ref:"Romans 9:30",verse:"What then shall we say? That the Gentiles, who did not pursue righteousness, have obtained it, a righteousness that is by faith."},
{q:"Who are you, a human being, to talk back to God? Shall what is formed say to the one who formed it, “Why did you make me like this?”",options:["The clay","The king","The priest","The angel"],answer:0,ref:"Romans 9:20",verse:"But who are you, a human being, to talk back to God? Shall what is formed say to the one who formed it, “Why did you make me like this?” Does not the potter have the right to make out of the same lump of clay some pottery for special purposes and some for common use?"},
{q:"How, then, can they call on the one they have not believed in? And how can they believe in the one of whom they have not heard? And how can they hear without someone doing what to them?",options:["Judging","Preaching","Preying","Paying"],answer:1,ref:"Romans 10:14",verse:"How, then, can they call on the one they have not believed in? And how can they believe in the one of whom they have not heard? And how can they hear without someone preaching to them?"},
{q:"Their voice has gone out into all the earth, their words to the ends of the world. Paul applies this to what?",options:["The law","The message about Christ","Roman roads","Temple worship"],answer:1,ref:"Romans 10:18",verse:"But I ask: Did they not hear? Of course they did: “Their voice has gone out into all the earth, their words to the ends of the world.”"},
{q:"Paul asks, “Did God reject his people?” What is his answer?",options:["Yes, permanently","By no means!","Only for a season","Only Gentiles remain"],answer:1,ref:"Romans 11:1",verse:"I ask then: Did God reject his people? By no means! I am an Israelite myself, a descendant of Abraham, from the tribe of Benjamin."},
{q:"Israel has experienced a hardening in part until the full number of the Gentiles has come in, and so in this way all Israel will be what?",options:["Rejected","Saved","Forgotten","Judged first"],answer:1,ref:"Romans 11:25-26",verse:"Israel has experienced a hardening in part until the full number of the Gentiles has come in, and in this way all Israel will be saved, as it is written."},
{q:"We have gifts that differ according to the grace given to us. If your gift is prophesying, what should you do in accordance with your faith?",options:["Hide it","Prophesy","Judge others","Leave the church"],answer:1,ref:"Romans 12:6",verse:"We have different gifts, according to the grace given to each of us. If your gift is prophesying, then prophesy in accordance with your faith."},
{q:"On the contrary: “If your enemy is hungry, feed him; if he is thirsty, give him something to drink. In doing this, you will heap burning coals on his” what?",options:["House","Head","Heart","Hands"],answer:1,ref:"Romans 12:20",verse:"On the contrary: “If your enemy is hungry, feed him; if he is thirsty, give him something to drink. In doing this, you will heap burning coals on his head.”"},
{q:"The one in authority is God’s servant for your good. But if you do wrong, be afraid, for rulers do not bear the sword for no reason. They are God’s servants, agents of wrath to bring punishment on whom?",options:["The righteous","The wrongdoer","The poor","Foreigners only"],answer:1,ref:"Romans 13:4",verse:"For the one in authority is God’s servant for your good. But if you do wrong, be afraid, for rulers do not bear the sword for no reason. They are God’s servants, agents of wrath to bring punishment on the wrongdoer."},
{q:"Give to everyone what you owe them: If you owe taxes, taxes; if revenue, then revenue; if respect, then respect; if honor, then what?",options:["Money","Honor","Silence","Fear"],answer:1,ref:"Romans 13:7",verse:"Give to everyone what you owe them: If you owe taxes, taxes; if revenue, then revenue; if respect, then respect; if honor, then honor."},
{q:"The night is nearly over; the day is almost here. So let us put aside the deeds of darkness and put on the armor of what?",options:["Wealth","Light","Silence","Tradition"],answer:1,ref:"Romans 13:12",verse:"The night is nearly over; the day is almost here. So let us put aside the deeds of darkness and put on the armor of light."},
{q:"One person considers one day more sacred than another; another considers every day alike. Each of them should be fully convinced in their own what?",options:["Church","Mind","Family","Tradition"],answer:1,ref:"Romans 14:5",verse:"One person considers one day more sacred than another; another considers every day alike. Each of them should be fully convinced in their own mind."},
{q:"Why do you judge your brother or sister? Or why do you treat them with contempt? For we will all stand before God’s what?",options:["Temple","Judgment seat","Altar","Law"],answer:1,ref:"Romans 14:10",verse:"You, then, why do you judge your brother or sister? Or why do you treat them with contempt? For we will all stand before God’s judgment seat."},
{q:"Blessed is the one who does not condemn himself by what he approves. But whoever has doubts is condemned if they eat, because their eating is not from what?",options:["Faith","Love","Knowledge","Tradition"],answer:0,ref:"Romans 14:22-23",verse:"Blessed is the one who does not condemn himself by what he approves. But whoever has doubts is condemned if they eat, because their eating is not from faith; and everything that does not come from faith is sin."},
{q:"We who are strong ought to bear with the failings of the weak and not to please ourselves. Each of us should please whom for their good, to build them up?",options:["Ourselves","Our neighbors","Our rulers","Our families only"],answer:1,ref:"Romans 15:1-2",verse:"We who are strong ought to bear with the failings of the weak and not to please ourselves. Each of us should please our neighbors for their good, to build them up."},
{q:"Paul says it has always been his ambition to preach the gospel where Christ was not known, so that he would not be building on whose foundation?",options:["Peter’s","Someone else’s","Abraham’s","Moses’"],answer:1,ref:"Romans 15:20",verse:"It has always been my ambition to preach the gospel where Christ was not known, so that I would not be building on someone else’s foundation."},
{q:"For everything that was written in the past was written to teach us, so that through the endurance taught in the Scriptures and the encouragement they provide we might have what?",options:["Anger","Hope","Wealth","Fear"],answer:1,ref:"Romans 15:4",verse:"For everything that was written in the past was written to teach us, so that through the endurance taught in the Scriptures and the encouragement they provide we might have hope."},
{q:"The God of peace will soon crush Satan under whose feet?",options:["Paul’s only","The Roman church’s only","Your (the believers’)","The angels’"],answer:2,ref:"Romans 16:20",verse:"The God of peace will soon crush Satan under your feet."},
{q:"Who greets the Roman Christians and identifies himself as the one who wrote down the letter in the Lord?",options:["Tertius","Timothy","Erastus","Lucius"],answer:0,ref:"Romans 16:22",verse:"I, Tertius, who wrote down this letter, greet you in the Lord."},
{q:"The mystery that has been kept hidden for long ages past, now revealed and made known through the prophetic writings, leads to the obedience that comes from where?",options:["The law alone","Tradition","Faith","The emperor"],answer:2,ref:"Romans 16:25-26",verse:"…the mystery hidden for long ages past, but now revealed and made known through the prophetic writings by the command of the eternal God, so that all the Gentiles might come to the obedience that comes from faith."}
];

const form = document.getElementById("quizForm");

questions.forEach((item,index)=>{
const div=document.createElement("div");
div.classList.add("question");
div.id=`qbox${index}`;

let html=`<p>${index+1}. ${item.q}</p>`;
item.options.forEach((opt,i)=>{
html+=`<label><input type="radio" name="q${index}" value="${i}"> ${opt}</label><br>`;
});

div.innerHTML=html;
form.appendChild(div);
});

function submitQuiz(){

let score=0;
let total=questions.length;

questions.forEach((q,i)=>{
const selected=document.querySelector(`input[name=q${i}]:checked`);
const box=document.getElementById(`qbox${i}`);

if(!selected) return;

const val=parseInt(selected.value);

if(val===q.answer){
score++;
box.classList.add("correct");
}else{
box.classList.add("incorrect");

const info=document.createElement("div");
info.className="correct-answer";

info.innerHTML=`
<b>Correct Answer:</b> ${q.options[q.answer]}<br>
<span class="verse">${q.ref} – ${q.verse}</span>
`;

box.appendChild(info);
}

document.querySelectorAll(`input[name=q${i}]`).forEach(inp=>inp.disabled=true);
});

let message=`Your Score: ${score} / ${total}\n\n`;

const nameInput = document.getElementById("nameInput");
const participantName = (nameInput && nameInput.value ? nameInput.value.trim() : "");
const safeName = participantName || "Participant";
const percentage = total > 0 ? Math.round((score / total) * 100) : 0;

const certificateContainer = document.getElementById("certificateContainer");
certificateContainer.style.display = "none";

if(score > 27){
  message += `Excellent, ${safeName}! You've grasped the essentials of Romans 🎉`;
  certificateContainer.style.display = "block";
  document.getElementById("certName").innerText = safeName;
  document.getElementById("certPercent").innerText = `${percentage}%`;
}
else if(score >= 18){
  message += `Good effort, ${safeName}! Review a few chapters and grow deeper 📖`;
}
else if(score >= 9){
  message += `You're learning, ${safeName}! Keep studying Romans carefully 🙏`;
}
else{
  message += `Take time to read Romans again, ${safeName}, and try once more 💪`;
}

document.getElementById("result").innerText=message;

document.getElementById("retakeContainer").innerHTML=
`<br><button onclick="location.reload()">Retake Quiz</button>`;
}

</script>

</body>
</html>
