<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romans JSON Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px 40px;
      line-height: 1.45;
    }
    .muted {
      color: #555;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .question {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .question p {
      margin: 0 0 8px;
      font-weight: 700;
    }
    .correct {
      background: #d4edda;
      border-color: #9ed6ad;
    }
    .incorrect {
      background: #f8d7da;
      border-color: #eaa8af;
    }
    .verse {
      margin-top: 8px;
      display: block;
      font-size: 13px;
      color: #333;
      font-style: italic;
    }
    .hidden {
      display: none;
    }
    button {
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }
    #result {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 700;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>Romans Multiple-Choice Quiz</h1>
  <p class="muted">
    Questions are generated from <code>Romans.json</code>. Each question asks for the correct reference
    based on the verse text.
  </p>

  <div class="card">
    <p style="margin-top:0;"><strong>Data source</strong></p>
    <p class="muted">
      Auto-load path: <code>../Bible-niv/Romans.json</code><br />
      If auto-load fails, choose <code>Romans.json</code> manually.
    </p>
    <input id="fileInput" type="file" accept=".json,application/json" />
    <button id="loadBtn" type="button">Load JSON</button>
    <p id="status" class="muted"></p>
  </div>

  <div class="card hidden" id="controls">
    <label for="countSelect"><strong>Number of questions:</strong></label>
    <select id="countSelect">
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20" selected>20</option>
      <option value="25">25</option>
      <option value="30">30</option>
    </select>
    <button id="startBtn" type="button">Start Quiz</button>
  </div>

  <form id="quizForm"></form>
  <div id="actions" class="hidden">
    <button id="submitBtn" type="button">Submit</button>
    <button id="retakeBtn" type="button">New Quiz</button>
  </div>
  <div id="result"></div>

  <script>
    const AUTO_PATH = "../Bible-niv/Romans.json";
    let verses = [];
    let questions = [];

    const statusEl = document.getElementById("status");
    const controlsEl = document.getElementById("controls");
    const formEl = document.getElementById("quizForm");
    const actionsEl = document.getElementById("actions");
    const resultEl = document.getElementById("result");

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function extractVerses(json) {
      const out = [];
      for (const chapterObj of json.chapters || []) {
        const chapter = chapterObj.chapter;
        for (const verseObj of chapterObj.verses || []) {
          const verse = verseObj.verse;
          const text = (verseObj.text || "").trim();
          if (!text) continue;
          out.push({
            ref: `Romans ${chapter}:${verse}`,
            text
          });
        }
      }
      return out;
    }

    function shortText(txt, max = 170) {
      if (txt.length <= max) return txt;
      return txt.slice(0, max).trimEnd() + "...";
    }

    function buildQuestions(pool, count) {
      const picked = shuffle(pool).slice(0, count);
      return picked.map((entry) => {
        const wrongPool = pool.filter((v) => v.ref !== entry.ref);
        const wrongRefs = shuffle(wrongPool).slice(0, 3).map((v) => v.ref);
        const options = shuffle([entry.ref, ...wrongRefs]);
        return {
          prompt: `Which reference matches this verse?`,
          verseText: shortText(entry.text),
          options,
          answer: options.indexOf(entry.ref),
          fullRef: entry.ref,
          fullVerse: entry.text
        };
      });
    }

    function renderQuiz() {
      formEl.innerHTML = "";
      questions.forEach((q, idx) => {
        const div = document.createElement("div");
        div.className = "question";
        div.id = `qbox-${idx}`;

        let html = `<p>${idx + 1}. ${q.prompt}</p>`;
        html += `<span class="verse">"${q.verseText}"</span><br/>`;
        q.options.forEach((opt, i) => {
          html += `<label><input type="radio" name="q${idx}" value="${i}"> ${opt}</label><br/>`;
        });
        div.innerHTML = html;
        formEl.appendChild(div);
      });

      actionsEl.classList.remove("hidden");
      resultEl.textContent = "";
    }

    function startQuiz() {
      const requested = parseInt(document.getElementById("countSelect").value, 10);
      const count = Math.min(requested, verses.length);
      questions = buildQuestions(verses, count);
      renderQuiz();
    }

    function submitQuiz() {
      let score = 0;
      const total = questions.length;

      questions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q${idx}"]:checked`);
        const box = document.getElementById(`qbox-${idx}`);
        if (!selected) return;

        const chosen = parseInt(selected.value, 10);
        if (chosen === q.answer) {
          score++;
          box.classList.add("correct");
        } else {
          box.classList.add("incorrect");
          const info = document.createElement("div");
          info.innerHTML = `<strong>Correct answer:</strong> ${q.fullRef}<span class="verse">${q.fullVerse}</span>`;
          box.appendChild(info);
        }

        document.querySelectorAll(`input[name="q${idx}"]`).forEach((input) => {
          input.disabled = true;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      resultEl.textContent = `Your Score: ${score} / ${total} (${pct}%)`;
      document.getElementById("submitBtn").disabled = true;
    }

    async function loadFromAutoPath() {
      try {
        const res = await fetch(AUTO_PATH);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        verses = extractVerses(json);
        if (verses.length < 4) throw new Error("Not enough verses found.");
        statusEl.textContent = `Loaded ${verses.length} verses from ${AUTO_PATH}.`;
        controlsEl.classList.remove("hidden");
      } catch (err) {
        statusEl.textContent = "Auto-load failed. Select Romans.json manually and click Load JSON.";
      }
    }

    async function loadFromFile() {
      const input = document.getElementById("fileInput");
      const file = input.files && input.files[0];
      if (!file) {
        statusEl.textContent = "Choose a JSON file first.";
        return;
      }

      try {
        const text = await file.text();
        const json = JSON.parse(text);
        verses = extractVerses(json);
        if (verses.length < 4) throw new Error("Not enough verses found.");
        statusEl.textContent = `Loaded ${verses.length} verses from ${file.name}.`;
        controlsEl.classList.remove("hidden");
      } catch (err) {
        statusEl.textContent = "Could not parse JSON. Make sure you selected Romans.json.";
      }
    }

    document.getElementById("loadBtn").addEventListener("click", loadFromFile);
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("submitBtn").disabled = false;
      startQuiz();
    });
    document.getElementById("submitBtn").addEventListener("click", submitQuiz);
    document.getElementById("retakeBtn").addEventListener("click", () => {
      document.getElementById("submitBtn").disabled = false;
      startQuiz();
    });

    loadFromAutoPath();
  </script>
</body>
</html>
